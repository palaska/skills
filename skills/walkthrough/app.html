<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --text:#d7dae0; --dim:#8b919c; --accent:#6cb6ff; --border:#2a2e37; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:15px/1.55 system-ui,sans-serif; max-width:880px; margin:0 auto; padding:0 24px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); }
  h1 { font-size:16px; margin:0; font-weight:600; }
  nav { display:flex; align-items:center; gap:8px; }
  nav button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 14px; font-size:15px; cursor:pointer; }
  nav button:disabled { opacity:.3; cursor:default; }
  nav .pos { color:var(--accent); font-size:13px; min-width:56px; text-align:center; }
  h2 { font-size:15px; font-weight:600; margin:22px 0 0; color:var(--accent); }
  .diagram { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; margin-top:16px; text-align:center; overflow-x:auto; }
  .diagram svg { max-width:100%; height:auto; }
  .box { display:inline-block; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 12px; margin:4px; font-size:13px; }
  .box.now { border-color:var(--accent); color:var(--accent); }
  .arrow { color:var(--dim); margin:0 4px; }
  .explain { margin-top:16px; }
  .note { background:var(--panel); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:12px 16px; margin-top:14px; }
  .note .q { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
  .note .diagram { background:var(--bg); }
  footer { margin-top:36px; padding-top:12px; border-top:1px solid var(--border); color:var(--dim); font-size:13px; }
  .raw { color:var(--dim); font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; text-align:left; margin:0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Walkthrough</h1>
  <nav>
    <button id="prev" title="Previous step (←)">‹</button>
    <div class="pos" id="pos"></div>
    <button id="next" title="Next step (→)">›</button>
  </nav>
</header>
<main id="main"></main>
<footer>Answer in the terminal. ←/→ to move between steps.</footer>
<script>
let data = null, viewing = 0, lastRaw = '';
const $ = id => document.getElementById(id);
if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark' });

async function drawDiagram(parent, d, key) {
  if (!d || !d.src) return;
  const wrap = document.createElement('div');
  wrap.className = 'diagram';
  parent.appendChild(wrap);
  if (d.type === 'mermaid' && window.mermaid) {
    try {
      const { svg } = await mermaid.render('m' + key.replace(/[^a-zA-Z0-9]/g, ''), d.src);
      wrap.innerHTML = svg;
      return;
    } catch (e) { /* fall through to raw */ }
  }
  if (d.type === 'html') { wrap.innerHTML = d.src; return; }
  const pre = document.createElement('pre');
  pre.className = 'raw';
  pre.textContent = d.src;
  wrap.appendChild(pre);
}

async function render() {
  if (!data || !data.steps || !data.steps.length) return;
  const n = data.steps.length;
  viewing = Math.max(0, Math.min(viewing, n - 1));
  const s = data.steps[viewing];
  $('title').textContent = data.title || 'Walkthrough';
  $('pos').textContent = (viewing + 1) + ' / ' + n;
  $('prev').disabled = viewing === 0;
  $('next').disabled = viewing === n - 1;
  const main = $('main');
  main.innerHTML = '';
  if (s.title) { const h = document.createElement('h2'); h.textContent = s.title; main.appendChild(h); }
  await drawDiagram(main, s.diagram, 'd' + viewing);
  if (s.explain) { const p = document.createElement('div'); p.className = 'explain'; p.textContent = s.explain; main.appendChild(p); }
  const notes = s.notes || [];
  for (let i = 0; i < notes.length; i++) {
    const card = document.createElement('div');
    card.className = 'note';
    if (notes[i].q) { const q = document.createElement('div'); q.className = 'q'; q.textContent = notes[i].q; card.appendChild(q); }
    if (notes[i].explain) { const p = document.createElement('div'); p.textContent = notes[i].explain; card.appendChild(p); }
    main.appendChild(card);
    await drawDiagram(card, notes[i].diagram, 'n' + viewing + '_' + i);
  }
}

function go(delta) { viewing += delta; render(); }
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

async function poll() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    const raw = await res.text();
    if (raw === lastRaw) return;
    const parsed = JSON.parse(raw);
    const following = !data || viewing === (data.current - 1);
    lastRaw = raw;
    data = parsed;
    if (following && data.current) viewing = data.current - 1;
    await render();
  } catch (e) { /* mid-write or server gone: try again next tick */ }
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
